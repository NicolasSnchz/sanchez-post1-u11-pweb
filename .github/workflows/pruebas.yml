# Integracion continua del laboratorio.
# - verificar: en cada push compila y corre la suite completa con JDK 17 y JDK 23.
# - evidencias: cuando no hay capturas o el codigo cambio desde las ultimas. Levanta el codigo de partida y la
#   aplicacion refactorizada, prueba los endpoints, toma las capturas y, si TODO paso, agrega el README.
name: Pruebas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: [17, 23]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: mvn clean verify
        working-directory: pedidos
        run: ./mvnw -B -ntp clean verify

  evidencias:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Revisar si las capturas corresponden al codigo actual
        id: estado
        run: |
          # se regeneran si no existen o si pedidos/src cambio despues del commit que las agrego
          ultima=$(git log -1 --format=%H -- capturas)
          if [ -z "$ultima" ] || ! git diff --quiet "$ultima" HEAD -- pedidos/src; then
            echo "hacer=si" >> "$GITHUB_OUTPUT"
          else
            echo "hacer=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v5
        if: steps.estado.outputs.hacer == 'si'
        with:
          distribution: temurin
          java-version: |
            23
            17
          cache: maven
      - name: Herramientas
        if: steps.estado.outputs.hacer == 'si'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xterm xvfb x11-utils imagemagick jq > /dev/null
          cd "$RUNNER_TEMP" && npm install --silent playwright@1.49.1 && npx playwright install --with-deps chromium > /dev/null
      - name: Medir y capturar
        if: steps.estado.outputs.hacer == 'si'
        run: bash .github/evidencias/generar.sh
      - name: Agregar README y capturas
        if: steps.estado.outputs.hacer == 'si'
        run: |
          if git cat-file -e HEAD:README.md 2>/dev/null; then
            mensaje="docs: actualizar README y capturas con la ejecucion del codigo actual"
          else
            mensaje="docs: README final con resumen de ambas partes, decisiones de diseño y capturas"
          fi
          git add README.md capturas
          git -c user.name="Nicolas Sanchez" -c user.email="nicosanchezvil@gmail.com" commit -qm "$mensaje"
          git push origin HEAD:main
      - name: Publicar los registros si algo fallo
        if: failure() && steps.estado.outputs.hacer == 'si'
        run: |
          cd evid
          git init -q -b evidencias
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Registros de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" evidencias
